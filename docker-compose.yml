services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mashbot}
      POSTGRES_USER: ${POSTGRES_USER:-mashbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mashbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mashbot} -d ${POSTGRES_DB:-mashbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mashbot}:${POSTGRES_PASSWORD:-mashbot}@db:5432/${POSTGRES_DB:-mashbot}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@mashbot.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-AdminPass123!}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:

